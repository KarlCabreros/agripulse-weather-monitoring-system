databases:
  - name: agripulse-db
    plan: free
    region: singapore
    databaseName: agripulse
    user: agripulse

services:
  - type: web
    name: agripulse-weather-monitoring-system
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: php artisan migrate --force
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: APP_NAME
        value: AgriPulse
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: APP_DEBUG
        value: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: agripulse-db
          property: connectionString
      - key: DB_URL
        fromDatabase:
          name: agripulse-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: BROADCAST_CONNECTION
        value: log
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: WEATHER_ALERT_TEMP
        value: 35
      - key: WEATHER_ALERT_HUMIDITY
        value: 90
      - key: WEATHER_ALERT_WIND
        value: 10
